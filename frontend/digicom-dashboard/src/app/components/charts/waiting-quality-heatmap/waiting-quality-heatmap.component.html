<div class="flex h-full w-full flex-col">
  <h2 class="text-lg font-semibold tracking-tight text-gray-900">
    Wartezeit und Gesprächsqualität
  </h2>
  <p class="mt-1 text-xs text-gray-600">Anteil je Bewertung innerhalb der Wartezeitgruppe</p>
  <div
    echarts
    [options]="chartOptions()"
    class="min-h-0 w-full flex-1"
    role="img"
    aria-label="Wartezeit und Gesprächsqualität eingehender Kontakte. Jede Bewertung hat eine eigene Farbe. Dunklere Zellen zeigen höhere Anteile je Wartezeitgruppe. Ein Strich kennzeichnet Gruppen ohne Kontakte."
  ></div>
  <p class="mt-1 text-center text-xs text-gray-600">Dunkler = höherer Anteil</p>
</div>
