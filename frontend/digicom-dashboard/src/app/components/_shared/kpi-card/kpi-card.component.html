<div
  class="group rounded-2xl border border-gray-200/80 px-5 py-4 shadow-sm transition-all duration-200 hover:-translate-y-0.5 hover:shadow-md"
  [class]="data().backgroundColorClass ?? 'bg-white'"
>
  <span class="text-sm font-medium tracking-tight text-gray-500">
    {{ data().label }}
  </span>

  <div class="mt-3 flex items-baseline gap-1.5">
    <span
      class="text-3xl font-semibold tracking-tight"
      [class]="data().textColorClass ?? 'text-gray-900'"
    >
      {{ data().value }}
    </span>

    @if (data().unit) {
      <span class="text-sm font-medium text-gray-400">
        {{ data().unit }}
      </span>
    }
  </div>
</div>
