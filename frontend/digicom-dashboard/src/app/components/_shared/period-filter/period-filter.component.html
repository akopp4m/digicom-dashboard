<div class="flex items-center gap-3">
  <label for="period" class="text-sm font-medium text-gray-600"> Zeitraum </label>

  <select
    id="period"
    class="rounded-lg border border-gray-200 bg-white px-3 py-2 pr-8 text-sm font-medium text-gray-700 shadow-sm outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100 min-w-60"
    [value]="selectedPeriod"
    (change)="onPeriodChange($event)"
  >
    @for (option of options; track option.value) {
      <option [value]="option.value">
        {{ option.label }}
      </option>
    }
  </select>
</div>
